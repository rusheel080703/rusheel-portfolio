<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent! | Rusheel Sable</title>
    <link rel="stylesheet" href="css/components/base.css" />
    <link rel="stylesheet" href="css/components/theme.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Sora', sans-serif;
        }
        .success-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 1rem;
        }
        h1 { color: var(--accent-color); margin-bottom: 1rem; }
        p { margin-bottom: 2rem; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="success-card">
        <h1>Message Received! 🚀</h1>
        <p>Thanks for reaching out. I've received your message and will get back to you at <strong>rusheelsable@gmail.com</strong> as soon as possible.</p>
        <a href="index.html" class="btn">Back to Portfolio</a>
    </div>
</body>
</html>
