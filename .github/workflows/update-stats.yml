name: Update GitHub Stats

on:
  schedule:
    - cron: '0 18 * * *' # Runs daily
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run update script
        run: node scripts/update-stats.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'chore: Update Rusheel GitHub stats'
          file_pattern: 'github_stats.json'
          # CHANGE THESE TO YOUR DETAILS
          commit_user_name: 'Rusheel Vijay Sable'
          commit_user_email: 'rusheelsable@gmail.com'
          commit_author: 'Rusheel Vijay Sable <rusheelsable@gmail.com>'